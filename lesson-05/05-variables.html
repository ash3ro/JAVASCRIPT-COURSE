<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
  </head>
  <body>
    <script>
      /*
        variable is kinda like a container.
        "let" is basically a "create" for variable.
        the "variable1" after the "let" is the name for the variable.
        the "=" after the variable name is equal and the "3" is what the variable contains.
        the "console.log();" is what displays the variables.
      */
      let variable1 = 3;
      console.log(variable1);

      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 2);

      const result = calculation + 2;
      console.log(result);
      /*
        you can use strings in variable too!
      */
      const message = 'hello';
      console.log(message); console.log(';');
      /*
        you can also change the value of a already existing variable.
        if you wanna change the value of a variable, you dont use "let" in the beginning.
        all of the "console.logs" after the value change will display as the new value.
      */
      variable1 = 5;
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);

      const variable2 = 3;
      var variable3 = 3;

      console.log(typeof variable2);
      console.log( typeof message);
    </script>
  </body>
</html>
