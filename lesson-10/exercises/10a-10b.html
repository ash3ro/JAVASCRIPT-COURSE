<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 10 exercise</title>

    <style>
      body {
        background-color: lightsteelblue;
      }

      .add-to-cart-button {
        background-color: rgb(255, 216, 20);
        font-size: 20px;
        border: none;
        border-radius: 25px;
        padding: 7px 50px;
        margin: 20px;
        display: block;
      }

      .request-button {
        background-color: black;
        color: white;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        padding: 13px 22px;
        margin: 0 15px;
      }

      .schedule-button {
        background-color: rgb(230, 230, 230);
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        padding: 13px 22px;
      }
    </style>
  </head>

  <body>
    <button class="add-to-cart-button">Add to cart</button>
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>
  </body>
</html>
